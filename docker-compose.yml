version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chickenman_postgres
    restart: always
    environment:
      POSTGRES_DB: thechickenman
      POSTGRES_USER: chickenuser
      POSTGRES_PASSWORD: chickenpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chickenuser -d thechickenman"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chickenman_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: chickenman_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://chickenuser:chickenpassword@postgres:5432/thechickenman
      SECRET_KEY: docker_compose_secret_key_prod_super_secure_chicken
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: chickenman_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
